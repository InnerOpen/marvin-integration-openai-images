[project]
name = "marvin-integration-openai-images"
version = "0.1.0"
description = "OpenAI image generation for Marvin — advertises the image.generate capability."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["marvin-integration-sdk>=0.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

# Advertises a *capability* — the media-enrichment resolver discovers it via
# integrations_providing("image.generate", group_id) and invokes it uniformly.
[project.entry-points."marvin.integrations"]
openai_images = "marvin_integration_openai_images:OpenAIImagesProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_integration_openai_images"]

[tool.ruff]
line-length = 150
target-version = "py311"
